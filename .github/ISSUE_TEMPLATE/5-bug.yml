name: Bug
description: Something does not work as specified.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behaviour, with exact error text or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: compose, Kind or staging; commit SHA.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The steps above no longer reproduce the problem.
        - [ ] A test covers the case.
